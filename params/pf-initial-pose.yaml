# mrpt_pf_localization parameter overrides: the initial pose.
# The map frame is the robot initial pose in the MVSim warehouse world (see the
# README), so the robot starts at the map origin. A known initial pose avoids
# a few seconds of wrong estimates while the filter resolves the heading.
/**:
  ros__parameters:
    initial_pose:
      mean: { x: 0.0, y: 0.0, z: 0.0, yaw: 0.0, pitch: 0.0, roll: 0.0 }
      std_x: 0.5     # 1 sigma uncertainty [meters]
      std_y: 0.5
      std_z: 0.0
      std_yaw: 0.05  # 1 sigma uncertainty [radians]
      std_pitch: 0.0
      std_roll: 0.0
